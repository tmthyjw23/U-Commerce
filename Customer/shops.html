<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semua Toko - U-Commerce</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        html, body {
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
        }
        main {
            flex-grow: 1;
            padding-bottom: 80px; /* Space for the bottom nav */
        }
    </style>
</head>
<body class="bg-background text-foreground">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 w-full bg-card shadow-soft border-b border-border">
        <div class="container mx-auto px-4 py-3">
            <div class="flex items-center gap-4">
                <a href="index.html" class="flex items-center gap-2 flex-shrink-0">
                    <div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center">
                        <span class="text-xl font-bold text-primary-foreground">U</span>
                    </div>
                    <span class="text-xl font-bold text-foreground hidden sm:block">U-Commerce</span>
                </a>
                <form class="flex-1 max-w-2xl" action="not-found.html">
                    <div class="relative">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-muted-foreground"></i>
                        <input type="search" placeholder="Cari barang, jasa, atau toko..." class="pl-10 pr-4 py-2 w-full bg-background border rounded-md border-border focus:ring-2 focus:ring-primary" />
                    </div>
                </form>
                <div class="flex items-center gap-2 sm:gap-4">
                    <a href="cart.html" class="relative p-2 hover:bg-accent rounded-lg transition-colors">
                        <i data-lucide="shopping-bag" class="h-6 w-6 text-foreground"></i>
                        <span class="absolute -top-1 -right-1 h-5 w-5 flex items-center justify-center p-0 rounded-full bg-primary text-primary-foreground text-xs">3</span>
                    </a>
                    <a href="chat.html" class="relative p-2 hover:bg-accent rounded-lg transition-colors">
                        <i data-lucide="message-circle" class="h-6 w-6 text-foreground"></i>
                        <span class="absolute -top-1 -right-1 h-5 w-5 flex items-center justify-center p-0 rounded-full bg-destructive text-destructive-foreground text-xs">1</span>
                    </a>
                    <a href="profile.html" class="p-2 hover:bg-accent rounded-lg transition-colors hidden sm:flex items-center gap-1">
                        <i data-lucide="user" class="h-6 w-6 text-foreground"></i>
                        <span class="text-sm font-medium text-foreground hidden md:block">K4</span>
                    </a>
                    <a href="not-found.html" class="p-2 hover:bg-accent rounded-lg transition-colors hidden sm:block" title="Logout">
                        <i data-lucide="log-out" class="h-6 w-6 text-foreground"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Main Content Area -->
    <main class="container mx-auto px-4 py-6">
        <div class="flex items-center gap-2 mb-6">
          <i data-lucide="store" class="h-6 w-6 text-primary"></i>
          <h1 class="text-2xl font-bold text-foreground">Semua Toko</h1>
        </div>

        <div class="space-y-3">
            <!-- Shop Card 1 -->
            <a href="shop-detail-ukit.html">
                <div class="border rounded-lg border-border bg-card hover-lift">
                    <div class="p-4">
                        <div class="flex items-start gap-3">
                            <div class="relative">
                                <div class="w-16 h-16 rounded-full overflow-hidden bg-muted border-2 border-primary/20">
                                    <img src="assets/shops/u-kitchen-logo.jpg" alt="U-Kitchen" class="w-full h-full object-cover">
                                </div>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="font-semibold text-base truncate hover:text-primary transition-colors">U-Kitchen</h3>
                                <div class="text-xs font-semibold px-2 py-1 bg-secondary text-secondary-foreground rounded-md mt-1 inline-block">Makanan</div>
                                <div class="mt-2 flex items-center gap-3 text-xs text-muted-foreground">
                                    <div class="flex items-center gap-1">
                                        <i data-lucide="star" class="h-3 w-3 fill-primary text-primary"></i>
                                        <span>4.8</span>
                                    </div>
                                    <div class="flex items-center gap-1">
                                        <i data-lucide="map-pin" class="h-3 w-3"></i>
                                        <span class="truncate">Kantin Jasmine</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </a>
            <!-- Shop Card 2 -->
            <a href="shop-detail-rhys.html">
                <div class="border rounded-lg border-border bg-card hover-lift">
                    <div class="p-4">
                        <div class="flex items-start gap-3">
                            <div class="relative">
                                <div class="w-16 h-16 rounded-full overflow-hidden bg-muted border-2 border-primary/20">
                                    <img src="assets/shops/byrhys-logo.jpg" alt="ByRhys Official" class="w-full h-full object-cover">
                                </div>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="font-semibold text-base truncate hover:text-primary transition-colors">By Rhys</h3>
                                <div class="text-xs font-semibold px-2 py-1 bg-secondary text-secondary-foreground rounded-md mt-1 inline-block">Barang</div>
                                <div class="mt-2 flex items-center gap-3 text-xs text-muted-foreground">
                                    <div class="flex items-center gap-1">
                                        <i data-lucide="star" class="h-3 w-3 fill-primary text-primary"></i>
                                        <span>4.9</span>
                                    </div>
                                    <div class="flex items-center gap-1">
                                        <i data-lucide="map-pin" class="h-3 w-3"></i>
                                        <span class="truncate">Online Shope</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </a>

    <!-- BottomNav -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-card border-t border-border shadow-strong md:hidden">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-around py-2">
                <a href="index.html" class="flex flex-col items-center gap-1 py-2 px-4 rounded-lg transition-colors"><i data-lucide="home" class="h-6 w-6"></i><span class="text-xs">Beranda</span></a>
                <a href="trending.html" class="flex flex-col items-center gap-1 py-2 px-4 rounded-lg transition-colors"><i data-lucide="trending-up" class="h-6 w-6"></i><span class="text-xs">Trending</span></a>
                <a href="notifications.html" class="flex flex-col items-center gap-1 py-2 px-4 rounded-lg transition-colors relative"><i data-lucide="bell" class="h-6 w-6"></i><span class="absolute -top-2 -right-2 h-4 w-4 flex items-center justify-center p-0 rounded-full bg-destructive text-white text-[10px]">2</span><span class="text-xs">Notifikasi</span></a>
                <a href="profile.html" class="flex flex-col items-center gap-1 py-2 px-4 rounded-lg transition-colors"><i data-lucide="user" class="h-6 w-6"></i><span class="text-xs">Saya</span></a>
            </div>
        </div>
    </nav>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
