<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-Commerce - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="d-flex justify-content-center align-items-center h-100">
    <div class="card shadow card-custom">

        <div class="logo-box">U</div>

        <h4 class="text-center fw-bold">U-Commerce</h4>
        <p class="text-center text-muted">Marketplace Kampus Terpercaya</p>

        <!-- ROLE RADIO LIKE REGIST -->
        <div class="d-flex justify-content-between mb-4 role-group">

            <input type="radio" name="role" id="loginPembeli" checked hidden>
            <label for="loginPembeli" class="role-btn">
                <i class="bi bi-bag"></i> Pembeli
            </label>

            <input type="radio" name="role" id="loginPenjual" hidden>
            <label for="loginPenjual" class="role-btn">
                <i class="bi bi-shop"></i> Penjual
            </label>

        </div>

        <form>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="role@Ucommerce.com">
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control">
            </div>

            <button type="submit" class="btn btn-login w-100 mt-2">Masuk</button>
        </form>

        <p class="text-center mt-3">
            Belum punya akun? <a href="regist.html" class="text-warning">Daftar sekarang</a>
        </p>

    </div>
</div>

<script>
    const form = document.querySelector('form');
    const emailInput = document.querySelector('input[type="email"]');
    const passwordInput = document.querySelector('input[type="password"]'); // Get password input

    form.addEventListener('submit', (event) => {
        event.preventDefault();
        const email = emailInput.value;
        const password = passwordInput.value; // Get password value

        if (email === 'Cust@Ucommerce.com' && password === '123') {
            window.location.href = './Customer/Index.html';
        } else if (email === 'Seller@Ucommerce.com' && password === '123') {
            window.location.href = './Seller/Index.html';
        } else {
            alert('Email atau password salah. Silakan coba lagi.');
        }
    });
</script>

</body>
</html>
