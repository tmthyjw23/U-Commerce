<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-Commerce - Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="regist.css">
</head>
<body>

<div class="d-flex justify-content-center align-items-center h-100">
    <div class="card shadow card-custom">

        <div class="logo-box">U</div>

        <h4 class="text-center fw-bold">U-Commerce</h4>
        <p class="text-center text-muted">Marketplace Kampus Terpercaya</p>

        <div class="d-flex justify-content-between mb-4 role-group">

            <input type="radio" name="role" id="pembeli" checked hidden>
            <label for="pembeli" class="role-btn">
                <i class="bi bi-bag"></i> Pembeli
            </label>

            <input type="radio" name="role" id="penjual" hidden>
            <label for="penjual" class="role-btn">
                <i class="bi bi-shop"></i> Penjual
            </label>

        </div>

        <form>
            <div class="mb-3">
                <label class="form-label">Nama Lengkap</label>
                <input type="text" class="form-control" placeholder="John Doe">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="email@student.ac.id">
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Konfirmasi Password</label>
                <input type="password" class="form-control">
            </div>

            <a href="login.html" class="btn btn-register w-100 mt-2">Daftar</a>
        </form>

        <p class="text-center mt-3">
            Sudah punya akun? <a href="login.html" class="text-warning">Masuk</a>
        </p>

    </div>
</div>

</body>
</html>
