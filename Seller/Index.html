<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Penjual</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo">
            <span class="logo-circle">U</span> 
            U-Commerce
        </div>

        <div class="header-right">
            <span>By Rhys</span>
            <i class="bi bi-box-arrow-right logout-icon"></i>
        </div>
    </header>

    <main class="container">
        <button class="btn-back"><i class="bi bi-arrow-left"></i> Kembali</button>

        <h1>Dashboard Penjual</h1>
        <p class="subtitle">Kelola toko dan produk Anda</p>

        <div class="top-buttons">
            <button class="btn-outline"><i class="bi bi-grid"></i> Menu Produk</button>
            <button class="btn-primary"><i class="bi bi-plus-circle"></i> Tambah Produk</button>
        </div>

        <div class="stats-grid">
            <div class="card">
                <i class="bi bi-currency-dollar icon"></i>
                <h2>Rp 0</h2>
                <p>Total Pendapatan</p>
            </div>

            <div class="card">
                <i class="bi bi-bag icon"></i>
                <h2>0</h2>
                <p>Pesanan Baru</p>
            </div>

            <div class="card">
                <i class="bi bi-box-seam icon"></i>
                <h2>0</h2>
                <p>Produk Aktif</p>
            </div>

            <div class="card">
                <i class="bi bi-star icon"></i>
                <h2>0</h2>
                <p>Rating Toko</p>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h3>Pesanan Terbaru</h3>
                <a href="#">Lihat Semua</a>
            </div>
            <p class="empty">Tidak ada pesanan terbaru.</p>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h3>Produk Unggulan</h3>
                <a href="#">Kelola</a>
            </div>
            <p class="empty">Tidak ada produk unggulan.</p>
        </div>

        <div class="panel settings">
            <i class="bi bi-gear"></i>
            <p>Pengaturan</p>
        </div>
    </main>
</body>
</html>
